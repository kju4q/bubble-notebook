<!doctype html><html lang="en"><meta charset="utf-8"><title>Bubble film and drift QA</title>
<style>body{font:15px system-ui;padding:16px}button{padding:12px}pre{white-space:pre-wrap}iframe{width:100%;height:980px}</style>
<h1>Bubble film and drift checks</h1><button id="run">Run scene checks</button><p id="summary">Generated audio only; no physical microphone or camera. Tests a full animated page.</p><iframe src="../dist/index.html"></iframe><pre id="result">Idle</pre>
<script type="module">
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(test,limit=5000)=>{const start=performance.now();while(performance.now()-start<limit){if(test())return performance.now()-start;await wait(8);}throw Error('Timed out');};
const out=document.getElementById('result'),run=document.getElementById('run');
run.onclick=async()=>{
 run.disabled=true;const rows=[];let ctx,stream,win;
 const report=(label,pass,data)=>{rows.push({label,pass,data});out.textContent=JSON.stringify(rows,null,2);document.getElementById('summary').textContent=label;if(!pass)throw Error(label);};
 try{
  win=document.querySelector('iframe').contentWindow;const doc=win.document,status=()=>win.bubbleBreath.status(),canvas=doc.getElementById('scene');
  doc.getElementById('sound').checked=false;doc.getElementById('sound').dispatchEvent(new win.Event('change'));
  for(let i=0;i<17;i++)doc.getElementById('practice').click();
  ctx=new AudioContext();await ctx.resume();const destination=ctx.createMediaStreamDestination();stream=destination.stream;
  const buffer=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate);let seed=71;const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){seed=(1664525*seed+1013904223)>>>0;data[i]=(seed/4294967296-.5)*.5;}
  const noise=ctx.createBufferSource(),gain=ctx.createGain(),tone=ctx.createOscillator(),voice=ctx.createGain();
  gain.gain.value=voice.gain.value=0;noise.buffer=buffer;noise.loop=true;noise.connect(gain);gain.connect(destination);noise.start();tone.frequency.value=220;tone.connect(voice);voice.connect(destination);tone.start();
  Object.defineProperty(win.navigator.mediaDevices,'getUserMedia',{configurable:true,value:async()=>stream});
  Object.defineProperty(win.navigator.mediaDevices,'enumerateDevices',{configurable:true,value:async()=>[]});
  doc.getElementById('mic-button').click();await until(()=>status().microphoneActive&&!status().calibrating);await wait(900);
  gain.gain.value=.07;const onset=await until(()=>status().growing,1000);
  report('First near-threshold breath remains prompt while 17 films animate',onset>=150&&onset<320&&status().speechFilter,{onsetMs:Math.round(onset),analysisGapMs:status().analysisGapMs,maxAnalysisGapMs:status().maxAnalysisGapMs});
  await wait(450);gain.gain.value=0;await until(()=>!status().growing);
  report('Actual breath release joins the drifting page',status().bubblesReleased===1&&status().bubblesOnPage===18,status().positions.at(-1));
  voice.gain.value=.15;await wait(1200);report('Voiced input remains rejected with all 18 bubbles on screen',!status().growing&&status().bubblesReleased===1,status().speechFilter);voice.gain.value=0;
  doc.getElementById('mic-button').click();
  await wait(14000);let positions=status().positions,rect=canvas.getBoundingClientRect();
  const span={x:Math.max(...positions.map(b=>b.x))-Math.min(...positions.map(b=>b.x)),y:Math.max(...positions.map(b=>b.y))-Math.min(...positions.map(b=>b.y))};
  report('Bubbles spread over the available page at different heights',span.x>(rect.width-150)*.65&&span.y>(rect.height-173)*.65,{span,width:rect.width,height:rect.height,positions});
  report('Every bubble stays within the interaction bounds',positions.every(b=>b.x>=50+b.r-1&&b.x<=rect.width-12-b.r+1&&b.y>=50+b.r-1&&b.y<=rect.height-35-b.r+1),positions);
  const before=status().positions;await wait(1500);const after=status().positions;
  report('The settled page continues to drift gently',after.filter((b,i)=>Math.hypot(b.x-before[i].x,b.y-before[i].y)>=1).length>=8,{before,after});
  const pointer=(type,x,y)=>{const r=canvas.getBoundingClientRect();canvas.dispatchEvent(new win.PointerEvent(type,{bubbles:true,clientX:r.left+x,clientY:r.top+y,pointerId:1,button:0}));};
  const capture=canvas.setPointerCapture;canvas.setPointerCapture=()=>{};
  let b=status().positions.at(-1);pointer('pointerdown',b.x,b.y);const held=status().heldBubble;const grab=status().positions.find(b=>b.id===held);await wait(200);
  report('Held bubbles stay still while other bubbles float',JSON.stringify(grab)===JSON.stringify(status().positions.find(b=>b.id===held)),grab);
  pointer('pointerup',grab.x,grab.y);const firstTap=status().positions.find(b=>b.id===held);await wait(350);
  report('Drift pauses between taps so double-click targets do not move',JSON.stringify(firstTap)===JSON.stringify(status().positions.find(b=>b.id===held)),firstTap);
  await wait(350);canvas.dispatchEvent(new win.KeyboardEvent('keydown',{key:' ',bubbles:true}));const keyboard=status().positions[0];await wait(900);
  report('Keyboard-selected bubbles remain fixed',JSON.stringify(keyboard)===JSON.stringify(status().positions[0]),keyboard);
  doc.getElementById('geometry-open').click();await wait(1000);const geometryPositions=status().positions;await wait(500);
  report('Geometry view pauses all page drift and keeps the exact ratios',JSON.stringify(geometryPositions)===JSON.stringify(status().positions)&&status().geometry.active,status().geometry);
  doc.getElementById('geometry-double').click();report('Double radius retains four times area, eight times volume and half pressure',doc.getElementById('geometry-area').textContent==='4.00×'&&doc.getElementById('geometry-volume').textContent==='8.00×'&&doc.getElementById('geometry-pressure').textContent==='0.50×',status().geometry.ratios);
  doc.getElementById('geometry-back').click();canvas.setPointerCapture=capture;
  out.textContent='PASS — film, drift, interaction and loaded microphone checks\n'+JSON.stringify(rows,null,2);document.getElementById('summary').textContent='PASS — all scene checks';
 }catch(e){out.textContent+='\nFAIL: '+e.message;document.getElementById('summary').textContent='FAIL: '+e.message;}finally{stream?.getTracks().forEach(t=>t.stop());await ctx?.close();run.disabled=false;}
};
</script></html>
