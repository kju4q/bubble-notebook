<!doctype html><html lang="en"><meta charset="utf-8"><title>Synthetic audio QA</title><style>body{font:16px system-ui;padding:20px}iframe{width:100%;height:850px;border:1px solid #ccc}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Synthetic input test — no microphone</h1><button id="run">Run synthetic audio check</button><pre id="result">Idle. This page supplies generated noise and a tone, not a person's breath.</pre><iframe id="app" src="../dist/index.html"></iframe><script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('pre');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('button').onclick=async()=>{
 document.querySelector('button').disabled=true;const rows=[];let ctx;
 const report=(label,ok,data)=>{rows.push({label,pass:ok,data});result.textContent=JSON.stringify(rows,null,2);if(!ok)throw new Error(label);};
 try{const win=frame.contentWindow;ctx=new AudioContext();await ctx.resume();const destination=ctx.createMediaStreamDestination();const gain=ctx.createGain();gain.gain.value=0;gain.connect(destination);const buffer=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate);let seed=71;const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++){seed=(1664525*seed+1013904223)>>>0;data[i]=(seed/4294967296-.5)*.5;}const noise=ctx.createBufferSource();noise.buffer=buffer;noise.loop=true;noise.connect(gain);noise.start();
 const tone=ctx.createOscillator(),toneGain=ctx.createGain();tone.frequency.value=220;toneGain.gain.value=0;tone.connect(toneGain);toneGain.connect(destination);tone.start();
 Object.defineProperty(win.navigator.mediaDevices,'getUserMedia',{configurable:true,value:async()=>destination.stream});
 Object.defineProperty(win.navigator.mediaDevices,'enumerateDevices',{configurable:true,value:async()=>[]});
 win.document.getElementById('mic-button').click();await wait(2450);report('Calibration completes',win.bubbleBreath.status().mode==='ready',win.bubbleBreath.status());
 await wait(400);report('Silence creates no bubbles',win.bubbleBreath.status().bubblesReleased===0,win.bubbleBreath.status());
 gain.gain.value=.8;await wait(750);const early=win.bubbleBreath.status();report('Sustained noise starts growth',early.growing,early);
 await wait(1100);const late=win.bubbleBreath.status();report('Continued input grows the bubble',late.radius>early.radius,late);
 gain.gain.value=0;await wait(850);report('Silence releases one note and bubble',!win.bubbleBreath.status().growing&&win.bubbleBreath.status().bubblesReleased===1&&!!win.bubbleBreath.status().lastNote,win.bubbleBreath.status());
 await wait(1100);toneGain.gain.value=.15;await wait(1300);report('Voiced synthetic tone rejected',win.bubbleBreath.status().bubblesReleased===1&&!win.bubbleBreath.status().growing,win.bubbleBreath.status());toneGain.gain.value=0;
 win.document.getElementById('mic-button').click();report('Stop releases audio tracks',destination.stream.getTracks().every(t=>t.readyState==='ended'),win.bubbleBreath.status());
 Object.defineProperty(win.navigator.mediaDevices,'getUserMedia',{configurable:true,value:async()=>{throw new DOMException('Denied for test','NotAllowedError');}});win.document.getElementById('mic-button').click();await wait(150);report('Permission denial has an actionable message',win.bubbleBreath.status().mode==='error'&&win.document.getElementById('status').textContent.includes('blocked'),win.document.getElementById('status').textContent);
 result.textContent='PASS — synthetic stream integration checks\n'+JSON.stringify(rows,null,2);
 }catch(e){result.textContent+='\nFAIL: '+e.message;}finally{await ctx?.close();document.querySelector('button').disabled=false;}
};
</script></html>
